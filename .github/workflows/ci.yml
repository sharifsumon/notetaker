name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg (audio validation/normalization tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply to a clean database
        run: |
          psql postgres://postgres:postgres@127.0.0.1:5432/postgres -c "create database ci_clean"
          DATABASE_MIGRATION_URL=postgres://postgres:postgres@127.0.0.1:5432/ci_clean pnpm db:migrate
          # Re-running is a no-op (idempotent upgrade path)
          DATABASE_MIGRATION_URL=postgres://postgres:postgres@127.0.0.1:5432/ci_clean pnpm db:migrate

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f infra/docker/server.Dockerfile -t notetaker-server:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t notetaker-web:ci .
      - name: Scan images (fail on high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: notetaker-server:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
