# Local development stack. Usage: cp .env.example .env && docker compose up --build
# Open http://localhost:8080 (web) — API docs at http://localhost:4000/api/docs
name: notetaker

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://notetaker_app_user:app_dev_password@postgres:5432/notetaker
    DATABASE_MIGRATION_URL: postgres://notetaker_owner:owner_dev_password@postgres:5432/notetaker
    REDIS_URL: redis://redis:6379
    PUBLIC_URL: http://localhost:8080
    # Mock webhooks are delivered from the worker to the API inside the compose network.
    WEBHOOK_PUBLIC_URL: http://api:4000
    STORAGE_LOCAL_DIR: /data/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notetaker
      POSTGRES_USER: notetaker_owner
      POSTGRES_PASSWORD: owner_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notetaker_owner -d notetaker"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infra/docker/server.Dockerfile }
    <<: *app-env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: infra/docker/server.Dockerfile }
    <<: *app-env
    command: ["node", "dist/main-api.js"]
    ports: ["4000:4000"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/server.Dockerfile }
    <<: *app-env
    command: ["node", "dist/main-worker.js"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_UPSTREAM: api:4000
    ports: ["8080:8080"]
    depends_on: [api]

  # Optional S3-compatible storage for testing STORAGE_DRIVER=s3 locally:
  #   docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  storage:
  miniodata:
